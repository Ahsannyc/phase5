---
# Security Best Practices:
#
# 1. Never commit secrets to Git
#    - Use .gitignore to exclude secret files
#    - Use external secret management (OCI Vault, AWS Secrets Manager, etc.)
#
# 2. Use Kubernetes Secrets with RBAC
#    - Limit secret access to specific ServiceAccounts
#    - Use Role/RoleBinding to grant minimal permissions
#
# 3. Rotate secrets regularly
#    - Update secrets in Kubernetes
#    - Restart pods to pick up new secrets
#
# 4. Use TLS for all external communications
#    - Database connections (sslmode=require)
#    - Kafka connections (TLS enabled)
#    - Ingress (HTTPS with cert-manager)
#
# 5. Encrypt secrets at rest
#    - Enable Kubernetes encryption at rest
#    - Use cloud provider encryption (OKE encryption)
#
# 6. Monitor secret access
#    - Enable audit logging for secret access
#    - Alert on unauthorized access attempts
#
# 7. Use external secret stores for production
#    - OCI Vault for OKE deployments
#    - AWS Secrets Manager for EKS
#    - Azure Key Vault for AKS
#    - HashiCorp Vault for multi-cloud

