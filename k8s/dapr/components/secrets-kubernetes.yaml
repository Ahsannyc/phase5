# Dapr Secret Store Component for Kubernetes
# Enables access to Kubernetes native secrets
# Version: Dapr v1.14+
# Component Type: secretstores.kubernetes

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secrets-kubernetes
  namespace: default
  labels:
    app: todo-app
    component: secretstore
    dapr.io/component: secretstore
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
  # Kubernetes namespace where secrets are stored
  # If not specified, uses the namespace where the component is deployed
  # Can reference secrets from multiple namespaces if RBAC allows
  # - name: namespace
  #   value: "default"

  # Default namespace behavior: use component's namespace
  # This ensures secrets are scoped per environment (dev, staging, prod)

# Scopes: limit which applications can use this secret store
# Restrict access to specific app-ids for security
scopes:
- todo-backend
- todo-frontend
# - todo-reminder-service
# - todo-audit-service

---
# Kubernetes Secret Example: Database Connection
# Create this secret before deploying the application
# kubectl create secret generic todo-app-secrets \
#   --from-literal=DATABASE_URL="postgresql://user:password@postgres:5432/tododb" \
#   --from-literal=BETTER_AUTH_SECRET="your-secret-key-here" \
#   --from-literal=COHERE_API_KEY="your-cohere-api-key" \
#   -n default

apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secrets
  namespace: default
  labels:
    app: todo-app
    component: secrets
type: Opaque
stringData:
  # Database connection string (PostgreSQL/Neon)
  # Format: postgresql://username:password@host:port/database?sslmode=require
  DATABASE_URL: "postgresql://todouser:changeme@postgres.default.svc.cluster.local:5432/tododb?sslmode=disable"

  # Authentication secret for BetterAuth
  BETTER_AUTH_SECRET: "your-better-auth-secret-key-change-in-production"

  # Cohere API key for chatbot functionality
  COHERE_API_KEY: "your-cohere-api-key-here"

  # Kafka SASL credentials (if using authenticated Kafka)
  # KAFKA_SASL_USERNAME: "kafka-user"
  # KAFKA_SASL_PASSWORD: "kafka-password"

  # TLS certificates (if using TLS for Kafka/PostgreSQL)
  # KAFKA_CA_CERT: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # KAFKA_CLIENT_CERT: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # KAFKA_CLIENT_KEY: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  #   -----END PRIVATE KEY-----

---
# Kubernetes Secret Example: OCI Registry Credentials
# For pulling container images from Oracle Container Image Registry (OCIR)
apiVersion: v1
kind: Secret
metadata:
  name: ocir-secret
  namespace: default
  labels:
    app: todo-app
    component: registry
type: kubernetes.io/dockerconfigjson
data:
  # Base64-encoded Docker config JSON
  # Create with: kubectl create secret docker-registry ocir-secret \
  #   --docker-server=<region>.ocir.io \
  #   --docker-username=<tenancy-namespace>/<oci-username> \
  #   --docker-password=<oci-auth-token> \
  #   --docker-email=<your-email>
  .dockerconfigjson: <base64-encoded-docker-config>

---
# Kubernetes Secret Example: TLS Certificate for Ingress
# For HTTPS ingress with cert-manager
apiVersion: v1
kind: Secret
metadata:
  name: todo-app-tls
  namespace: default
  labels:
    app: todo-app
    component: ingress
type: kubernetes.io/tls
data:
  # Base64-encoded certificate and key
  # Automatically managed by cert-manager if using Let's Encrypt
  tls.crt: <base64-encoded-certificate>
  tls.key: <base64-encoded-private-key>

---
# ServiceAccount for Dapr Secret Access
# Grant Dapr sidecars permission to read Kubernetes secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-app-sa
  namespace: default
  labels:
    app: todo-app
    component: serviceaccount

---
# RBAC Role: Allow reading secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todo-app-secret-reader
  namespace: default
  labels:
    app: todo-app
    component: rbac
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
  # Restrict to specific secrets for security
  resourceNames:
  - todo-app-secrets
  - ocir-secret
  - todo-app-tls

---
# RBAC RoleBinding: Bind ServiceAccount to Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todo-app-secret-reader-binding
  namespace: default
  labels:
    app: todo-app
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: todo-app-secret-reader
subjects:
- kind: ServiceAccount
  name: todo-app-sa
  namespace: default

