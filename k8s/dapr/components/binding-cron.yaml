# Dapr Bindings Component for Cron
# Enables scheduled reminder checks via cron expressions
# Version: Dapr v1.14+
# Component Type: bindings.cron

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: binding-cron
  namespace: default
  labels:
    app: todo-app
    component: bindings
    dapr.io/component: bindings
spec:
  type: bindings.cron
  version: v1
  metadata:
  # Cron schedule expression
  # Format: Standard cron syntax or predefined schedules
  # Predefined: @yearly, @monthly, @weekly, @daily, @hourly, @every <duration>
  # Standard: "0 */5 * * * *" (every 5 minutes)
  #
  # Default: @every 5m (check reminders every 5 minutes)
  # For production: adjust based on reminder precision requirements
  - name: schedule
    value: "@every 5m"

  # Direction: output only (cron triggers application, not vice versa)
  - name: direction
    value: "input"

# Scopes: limit which applications can use this binding
# Only the backend service should handle cron triggers
# scopes:
# - todo-backend

---
# Additional Cron Binding for Daily Cleanup (optional)
# Cleans up expired notifications and old audit logs
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: binding-cron-daily-cleanup
  namespace: default
  labels:
    app: todo-app
    component: bindings
    dapr.io/component: bindings
spec:
  type: bindings.cron
  version: v1
  metadata:
  # Run daily at midnight UTC
  - name: schedule
    value: "0 0 * * *"
  - name: direction
    value: "input"

# scopes:
# - todo-backend

