---
# Cron Schedule Examples:
#
# Every minute:
#   schedule: "* * * * * *"
#
# Every 5 minutes:
#   schedule: "0 */5 * * * *"
#   OR
#   schedule: "@every 5m"
#
# Every hour at minute 0:
#   schedule: "0 0 * * * *"
#   OR
#   schedule: "@hourly"
#
# Every day at midnight UTC:
#   schedule: "0 0 0 * * *"
#   OR
#   schedule: "@daily"
#
# Every Monday at 9:00 AM UTC:
#   schedule: "0 0 9 * * 1"
#
# Every 30 seconds:
#   schedule: "@every 30s"
#
# Custom duration examples:
#   @every 10s (every 10 seconds)
#   @every 1h30m (every 1 hour 30 minutes)
#   @every 24h (every 24 hours)
#
# Note: For high-precision reminders (sub-minute), consider using @every syntax
# For production, balance precision with system load
