apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-app.fullname" . }}-backend
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app: todo-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "todo-app.selectorLabels.backend" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todo-app.selectorLabels.backend" . | nindent 8 }}
    spec:
      {{- with .Values.securityContext.backend }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        # Environment variables from Kubernetes Secret
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "todo-app.secretName" . }}
              key: DATABASE_URL
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "todo-app.secretName" . }}
              key: BETTER_AUTH_SECRET
        - name: COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "todo-app.secretName" . }}
              key: COHERE_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "todo-app.secretName" . }}
              key: OPENAI_API_KEY

        {{- with .Values.backend.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}

        {{- with .Values.backend.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}

        {{- with .Values.backend.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}

        # Graceful shutdown hook
        {{- if .Values.backend.preStopHook }}
        lifecycle:
          preStop:
            {{- toYaml .Values.backend.preStopHook | nindent 14 }}
        {{- end }}

      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
