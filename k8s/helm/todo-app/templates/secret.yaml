apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.secretName" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | b64enc }}
  {{- end }}
  {{- if .Values.secrets.BETTER_AUTH_SECRET }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.BETTER_AUTH_SECRET | b64enc }}
  {{- end }}
  {{- if .Values.secrets.COHERE_API_KEY }}
  COHERE_API_KEY: {{ .Values.secrets.COHERE_API_KEY | b64enc }}
  {{- end }}
  {{- if .Values.secrets.OPENAI_API_KEY }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | b64enc }}
  {{- end }}
