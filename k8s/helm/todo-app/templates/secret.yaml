# =============================================================================
# Secret Template
# =============================================================================
# Creates a Kubernetes Secret for sensitive configuration
# IMPORTANT: This template should be used with external secret management
# (External Secrets Operator, Sealed Secrets, or Oracle Vault)
# Never commit actual secret values to Git!
# =============================================================================
{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: {{ .Values.secrets.type }}
data:
  # Database connection string (PostgreSQL/Neon)
  {{- if .Values.secrets.data.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.data.DATABASE_URL | b64enc }}
  {{- end }}

  # Better Auth secret for session management
  {{- if .Values.secrets.data.BETTER_AUTH_SECRET }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.data.BETTER_AUTH_SECRET | b64enc }}
  {{- end }}

  # Cohere API key for chatbot
  {{- if .Values.secrets.data.COHERE_API_KEY }}
  COHERE_API_KEY: {{ .Values.secrets.data.COHERE_API_KEY | b64enc }}
  {{- end }}

  # OpenAI API key for chatbot
  {{- if .Values.secrets.data.OPENAI_API_KEY }}
  OPENAI_API_KEY: {{ .Values.secrets.data.OPENAI_API_KEY | b64enc }}
  {{- end }}

  # ChatKit API key
  {{- if .Values.secrets.data.CHATKIT_API_KEY }}
  CHATKIT_API_KEY: {{ .Values.secrets.data.CHATKIT_API_KEY | b64enc }}
  {{- end }}

{{- end }}

