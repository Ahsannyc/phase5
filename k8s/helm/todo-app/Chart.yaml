apiVersion: v2
name: todo-app
description: Event-driven cloud-native Todo application with AI chatbot, Dapr, Kafka, and multi-cloud deployment
type: application

# Chart version (increment on each release)
version: 5.0.0

# Application version (sync with app releases)
appVersion: "5.0"

# Chart metadata
home: https://github.com/yourusername/todo-app
sources:
  - https://github.com/yourusername/todo-app
maintainers:
  - name: Todo App Team
    email: team@todoapp.local

# Keywords for discovery
keywords:
  - todo
  - task-management
  - chatbot
  - kubernetes
  - helm
  - cloud-native

# Chart dependencies (none for Phase 4)
dependencies: []

# Minimum Kubernetes version
kubeVersion: ">=1.20.0"

# Chart annotations
annotations:
  category: Application
  licenses: MIT
