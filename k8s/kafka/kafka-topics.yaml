# Kafka Topics Configuration for Phase 5 Event-Driven Architecture
# This file defines the Kafka topics for event streaming in the Todo application
# Compatible with Strimzi Kafka Operator for Kubernetes deployment

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: task-events
  namespace: kafka
  labels:
    strimzi.io/cluster: todo-kafka
    app: todo-app
    component: messaging
spec:
  # Topic for task lifecycle events (create, update, delete, complete)
  # High volume topic requiring partitioning for scalability
  partitions: 3
  replicas: 1  # Set to 3 for production OKE deployment
  config:
    # Retention policy: 7 days minimum for audit compliance
    retention.ms: 604800000  # 7 days in milliseconds
    # Segment size: 100MB per segment for efficient compaction
    segment.bytes: 104857600
    # Compression for storage efficiency
    compression.type: producer
    # Minimum in-sync replicas for durability (set to 2 in production)
    min.insync.replicas: 1
    # Cleanup policy: delete old segments after retention period
    cleanup.policy: delete
    # Message timestamp type: use producer timestamp
    message.timestamp.type: CreateTime

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: reminders
  namespace: kafka
  labels:
    strimzi.io/cluster: todo-kafka
    app: todo-app
    component: messaging
spec:
  # Topic for reminder notifications triggered by cron binding
  # Single partition as reminders are processed sequentially
  partitions: 1
  replicas: 1  # Set to 3 for production OKE deployment
  config:
    # Retention policy: 7 days for notification history
    retention.ms: 604800000
    # Segment size: 50MB (lower volume than task-events)
    segment.bytes: 52428800
    # Compression enabled
    compression.type: producer
    # Minimum in-sync replicas
    min.insync.replicas: 1
    # Cleanup policy: delete
    cleanup.policy: delete
    # Message timestamp type: CreateTime
    message.timestamp.type: CreateTime

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: task-updates
  namespace: kafka
  labels:
    strimzi.io/cluster: todo-kafka
    app: todo-app
    component: messaging
spec:
  # Topic for task update events (status changes, field modifications)
  # Partitioned for high-throughput updates
  partitions: 3
  replicas: 1  # Set to 3 for production OKE deployment
  config:
    # Retention policy: 7 days
    retention.ms: 604800000
    # Segment size: 100MB
    segment.bytes: 104857600
    # Compression enabled
    compression.type: producer
    # Minimum in-sync replicas
    min.insync.replicas: 1
    # Cleanup policy: delete
    cleanup.policy: delete
    # Message timestamp type: CreateTime
    message.timestamp.type: CreateTime

---
