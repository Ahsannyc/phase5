---
# Kafka Cluster for Minikube using Strimzi Operator
# This manifest deploys a single-broker Kafka cluster suitable for development/testing

apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: todo-kafka
  namespace: kafka
spec:
  kafka:
    version: 3.6.0
    replicas: 1  # Single broker for Minikube (development)
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      log.retention.hours: 168  # 7 days retention
      log.segment.bytes: 1073741824  # 1GB segments
      num.network.threads: 8
      num.io.threads: 8
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600
    storage:
      type: ephemeral  # Use ephemeral storage for Minikube (no persistence)
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1"
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 10
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10

  zookeeper:
    replicas: 1  # Single ZK for Minikube
    storage:
      type: ephemeral
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 10
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10

  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    userOperator:
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"

---
# Kafka Topics - Using KafkaTopic Custom Resource (Strimzi)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: task-events
  namespace: kafka
  labels:
    strimzi.io/cluster: todo-kafka
spec:
  partitions: 3
  replicationFactor: 1
  config:
    retention.ms: 604800000  # 7 days
    segment.ms: 86400000     # 1 day
    compression.type: snappy
    min.insync.replicas: 1

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: reminders
  namespace: kafka
  labels:
    strimzi.io/cluster: todo-kafka
spec:
  partitions: 1  # Reminders need ordering, so single partition
  replicationFactor: 1
  config:
    retention.ms: 604800000
    segment.ms: 86400000
    compression.type: snappy
    min.insync.replicas: 1

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: task-updates
  namespace: kafka
  labels:
    strimzi.io/cluster: todo-kafka
spec:
  partitions: 3  # Parallel task updates
  replicationFactor: 1
  config:
    retention.ms: 604800000
    segment.ms: 86400000
    compression.type: snappy
    min.insync.replicas: 1

---
# Service to expose Kafka broker for external access (Minikube)
apiVersion: v1
kind: Service
metadata:
  name: todo-kafka-external
  namespace: kafka
spec:
  type: NodePort
  selector:
    strimzi.io/cluster: todo-kafka
    strimzi.io/kind: Kafka
    strimzi.io/name: todo-kafka-kafka
  ports:
    - name: bootstrap
      port: 9092
      targetPort: 9092
      nodePort: 30092
    - name: tls
      port: 9093
      targetPort: 9093
      nodePort: 30093
